# admitly in-cluster deployment (lab use). Generate TLS material first:
#   admitly certs --hosts admitly.admitly-system.svc --out certs
#   kubectl -n admitly-system create secret tls admitly-tls --cert certs/tls.crt --key certs/tls.key
# then apply this file and webhooks.yaml (with caBundle set from certs/ca.crt).
apiVersion: v1
kind: Namespace
metadata:
  name: admitly-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admitly
  namespace: admitly-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admitly-config
  namespace: admitly-system
data:
  admitly.yaml: |
    listen: ":8443"
    tls:
      certFile: /etc/admitly/tls/tls.crt
      keyFile: /etc/admitly/tls/tls.key
    failureMode: Closed
    timeout: 3s
    policies:
      builtin: true
      dirs: [/etc/admitly/policies]
      reloadInterval: 10s
    signatures:
      storeDir: /etc/admitly/signatures
    audit:
      file: "-"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admitly-policies
  namespace: admitly-system
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admitly
  namespace: admitly-system
  labels:
    app.kubernetes.io/name: admitly
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admitly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admitly
    spec:
      serviceAccountName: admitly
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: admitly
      containers:
        - name: admitly
          image: ghcr.io/archit2501/admitly:0.1.0
          args: ["serve", "--config", "/etc/admitly/config/admitly.yaml"]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /etc/admitly/config, readOnly: true}
            - {name: policies, mountPath: /etc/admitly/policies, readOnly: true}
            - {name: tls, mountPath: /etc/admitly/tls, readOnly: true}
            - {name: signatures, mountPath: /etc/admitly/signatures, readOnly: true}
      volumes:
        - name: config
          configMap: {name: admitly-config}
        - name: policies
          configMap: {name: admitly-policies}
        - name: tls
          secret: {secretName: admitly-tls}
        - name: signatures
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: admitly
  namespace: admitly-system
spec:
  selector:
    app.kubernetes.io/name: admitly
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admitly
  namespace: admitly-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admitly
